name: Security checks

# This repo is a PUBLIC site served raw, so every push is scanned before it matters:
# gitleaks (full history), semgrep (ERROR level fails), and the disclosure check.
# Actions are pinned to commit SHAs (mutable tags can be re-pointed).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # gitleaks scans full history

      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o gl.sums "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" gl.sums | sed "s/gitleaks_${V}_linux_x64.tar.gz/gl.tgz/" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: semgrep (ERROR level fails)
        run: |
          pip install --quiet semgrep
          semgrep scan --config auto --error --severity ERROR .

      - name: disclosure check
        run: bash scripts/prepublish-check.sh
