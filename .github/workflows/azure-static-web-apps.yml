name: Deploy to Azure Static Web Apps

# Manual-only: the site is served by GitHub Pages. This workflow stays here
# ready for an Azure Static Web Apps deployment, but does not run on push --
# without the AZURE_STATIC_WEB_APPS_API_TOKEN secret it would only ever fail.
# To switch to Azure: add the secret, then restore the push/pull_request
# triggers below.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # index.html is committed pre-built, so there is nothing to compile
          app_location: "/"
          output_location: ""
          skip_app_build: true
